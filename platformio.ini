[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  links2004/WebSockets@^2.6.0
build_src_filter =
  +<*.cpp>
  +<ports/common/leddy_port.c>
  -<ports/esp32-idf/>
  -<ports/stm32cube/>
build_flags =
  -I src/ports/common
  -D LEDDY_FIRMWARE_VERSION=\"0.1.0\"

; Native ESP-IDF port for Wi-Fi/BLE capable ESP32-S3 boards.
[env:esp32s3-idf]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
build_src_filter =
  -<*>
  +<ports/common/leddy_port.c>
  +<ports/esp32-idf/main.c>
build_flags =
  -I src/ports/common
  -D LEDDY_FIRMWARE_VERSION=\"0.2.0\"

; STM32Cube HAL port for deterministic matrix scanning on Nucleo F446RE.
[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
build_src_filter =
  -<*>
  +<ports/common/leddy_port.c>
  +<ports/stm32cube/main.c>
build_flags =
  -I src/ports/common
  -D LEDDY_FIRMWARE_VERSION=\"0.2.0\"

; Host-only contract, playback, and framebuffer-planning tests.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<ports/common/leddy_port.c>
build_flags =
  -I src/ports/common
